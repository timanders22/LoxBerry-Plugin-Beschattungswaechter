[AUTOUPDATE]
# Diese Datei gehoert in das Wurzelverzeichnis des GitHub-Repositories und
# steuert dort das Auto-Update. Sie wird erst abgerufen, wenn in der
# plugin.cfg AUTOMATIC_UPDATES auf true steht.
#
# Bei jedem Release vier Stellen gleichzeitig anfassen:
#   1. plugin.cfg     -> VERSION
#   2. release.cfg    -> DIESE Datei, VERSION und BEIDE Adressen
#   3. prerelease.cfg -> dasselbe noch einmal
#   4. auf GitHub ein Release mit genau diesem Tag (vX.Y.Z)
#
# Punkt 3 stand bis 0.9.12 in KEINER der beiden Dateien - die Liste war in
# release.cfg und prerelease.cfg byteweise gleich und nannte nur die andere.
# Wer ihr folgte, hob genau die Datei nicht an, in der er gerade las.
VERSION=0.9.13
ARCHIVEURL=https://github.com/timanders22/LoxBerry-Plugin-Beschattungswaechter/archive/refs/tags/v0.9.13.zip
INFOURL=https://github.com/timanders22/LoxBerry-Plugin-Beschattungswaechter/releases/tag/v0.9.13
