[HILFE]
K01 = "Beschattungswächter"
K02 = "Am 24.08.2026 stand in diesem Haus die Sonne im Osten, die Beschattungsfreigabe war erteilt, alle achtzehn Räume forderten Beschattung — und keine einzige der 25 Rollladenautomatiken war scharf. Ein Druck auf das <b>A</b> im Zentralbaustein, und sechs Rollläden fuhren sofort auf 80 Prozent."
K03 = "Der Grund ist eine Eigenart des Loxone-Bausteins <i>Automatische Beschattung</i>: <b>die Sonnenstandsautomatik lässt sich aus der Logik heraus nicht einschalten.</b> Es gibt die Eingänge <span class='sm-mono'>Sps</span> (Start), <span class='sm-mono'>DisSp</span> (Sperre) und <span class='sm-mono'>Spr</span> (Reaktivierung nach Handbedienung) — aber keinen, der eine abgeschaltete Automatik zurückholt. Das kann nur der Befehl, den das A in der App absetzt."
K04 = "Und was sie abschaltet"
K05 = "Die Schaltuhr selbst. Sie fährt die Rollläden morgens über den Eingang <span class='sm-mono'>Co</span> (Complete open) hoch, und eine Bedienung über Co gilt für Loxone als <b>Handbedienung</b> — die schaltet die Sonnenstandsautomatik für den Rest des Tages ab. Das Haus schaltet sich also jeden Morgen seine eigene Beschattung aus, und niemand merkt es, solange die Freigabe ohnehin selten kommt."
K06 = "Was das Plugin tut"
K07 = "Es schickt in einem einstellbaren Abstand denselben Befehl an den Miniserver, den das A auslöst: <span class='sm-mono'>/dev/sps/io/&lt;Kennung&gt;/auto</span> – am Zentralbaustein wie an einem einzelnen Rollladen mit Automatik. Der Befehl ist folgenlos, wenn die Automatik schon an ist."
K08 = "Das Passwort bleibt, wo es hingehört"
K09 = "Die Zugangsdaten des Miniservers holt das Plugin aus der <b>zentralen LoxBerry-Konfiguration</b> — dort, wo jedes Ihrer Plugins sie schon findet. Sie stehen weder in diesem Plugin noch in der Loxone-Projektdatei, und die Oberfläche zeigt sie nicht an. Das ist der Grund, warum dieser Weg über den LoxBerry läuft und nicht über einen virtuellen Ausgang in Loxone: dort müsste das Passwort in der Adresse stehen."
K10 = "Der Abstand ist eine Abwägung"
K11 = "Der Befehl holt auch eine Automatik zurück, die jemand <b>absichtlich</b> abgeschaltet hat. Wer einen Rollladen in der Sonne hochfährt, hat ihn sonst kurz darauf wieder unten. Sechzig Minuten sind lang genug, dass das im Alltag nicht stört, und kurz genug, dass eine Fassade, deren Sonne erst mittags kommt, den Tag nicht verpasst. Wer es anders will, ändert die Zahl — sie steht an einer einzigen Stelle."
K12 = "Einrichten"
K13 = "Im Reiter <i>Einstellungen</i> den Miniserver wählen, die Kennung des Bausteins eintragen und einschalten. Danach im Reiter <i>Test</i> auf <b>Befehl jetzt senden</b> — fahren daraufhin Rollläden oder wechselt in der App das A auf grün, ist der Weg in Ordnung. Ab dann übernimmt der Cron."
K14 = "Was das Plugin nicht tut"
K15 = "Es entscheidet <b>nicht</b>, ob beschattet wird. Das bleibt Sache der Loxone-Logik: Strahlung, Sonnenstand, Raumtemperatur, Freigabe. Das Plugin sorgt allein dafür, dass die Automatik überhaupt eingeschaltet ist — sonst rechnet die ganze Logik dahinter ins Leere."
K16 = "Der Rückweg: Loxone erfährt, ob der Wächter lebt"
K17 = "Bis zur Fassung 0.9.10 war das Plugin eine <b>Einbahnstraße</b>. Seit 0.9.31 ist der Rückweg nach Loxone das <b>MQTT-Gateway</b> (nächster Abschnitt). Den Endpunkt im unangemeldeten Bereich, geschützt durch ein <b>Merkwort</b>, gibt es weiter für bestehende Anlagen: der Lesezweig (status, json) hängt am Haken „HTTP-Lesezweig für Loxone annehmen“ – ab Werk aus, nach einem Update an; jetzt, pruefen und der Selbsttest bleiben hinter dem Merkwort. Das Feld <span class='sm-mono'>OK</span> geht auf 0, sobald der letzte Durchgang des Takts länger als 15 Minuten zurückliegt; <span class='sm-mono'>LAUFALTER</span> gibt es nur über HTTP."
K18 = "MQTT als Hauptweg"
K19 = "Das Plugin <i>schickt</i> seine Werte in jedem Fünfminutentakt über das MQTT-Gateway – alle Themen, auch wenn nichts zu senden war; die drei Themen unter <span class='sm-mono'>status</span> sind das Lebenszeichen. Bei einer Neuinstallation ist MQTT ab Werk an; eine bestehende Anlage behält ihre Einstellung. Der Reiter <i>Einbindung in Loxone</i> nennt je Thema den Namen, den das Gateway als Virtuellen Eingang vergibt; der Reiter MQTT die Haken für Gateway Fassung 2 (bei status/ok und ziele „Noncached“). Das Abonnement für Fassung 1 führt das Plugin selbst in <span class='sm-mono'>mqtt_subscriptions.cfg</span>."
K20 = "Die Wirkung messen, nicht den Rückgabewert"
K21 = "<span class='sm-mono'>HTTP 200</span> heißt nur: der Miniserver hat den Befehl <i>angenommen</i>. Ob danach eine Automatik wirklich scharf ist, steht im Zustand <span class='sm-mono'>autoActive</span>. Mit dem Haken „Die Wirkung messen“ (ab Werk aus) zählt das Plugin im Zeitfenster alle 15 Minuten, auch ohne Befehl, nur autoActive (höchstens 40 Jalousien; nach drei Fehlschlägen in Folge oder 60 s bricht die Zählung ab); der Knopf im Reiter Test zählt sofort und liest auch den Grund. Ohne Zählung steht bei <span class='sm-mono'>SCHARF</span> und <span class='sm-mono'>AUTOMATIKEN</span> -1. Misslingt eine Zählung, bleiben die zuletzt gezählten Werte stehen, und <span class='sm-mono'>OK</span> geht auf 0, bis wieder eine gelingt."
K22 = "Einstellungen sichern und zurückspielen"
K23 = "Zwei Knöpfe im Reiter <i>Einstellungen</i>. Die Sicherungsdatei trägt auch das <b>Merkwort</b> des Endpunkts — ohne das wäre sie nach dem Zurückspielen wertlos: alle in Loxone eingetragenen Adressen wären ungültig, und der Miniserver bekäme auf jede Abfrage eine 403. Wer die Datei weitergibt, gibt damit den Schlüssel zu diesem Endpunkt weiter. Zurückgespielt wird nur eine vollständige Datei, deren Werte alle dieselbe Prüfung bestehen wie eine Eingabe im Formular. Fehlt eine Einstellung, steht eine unbekannte darin oder ist ein Wert unzulässig, wird die Datei als Ganzes abgelehnt, alle Gründe werden genannt, und es ändert sich nichts. Sicherungen aus Fassungen vor 0.9.11 kennen das Merkwort und die Miniserver-Auswahl noch nicht und werden deshalb abgelehnt. Ein leeres Merkwort in der Datei heißt: es war keines gesichert – dann bleibt das geltende stehen, und die Meldung sagt es."
K24 = "Wenn etwas nicht stimmt"
K25 = "Der Reiter <i>Test</i> prüft sich selbst und sagt bei jeder Zeile auch, wenn er etwas <b>nicht feststellen konnte</b> — ein Kreuz, das nichts bedeutet, ist schlimmer als keine Prüfung. Zusätzlich meldet sich das Plugin bei LoxBerry selbst: die Systemseite zeigt ein Ampelzeichen, und dieselbe Meldung geht über MQTT hinaus. Am 24.08.2026 stand dieses Plugin vollständig installiert da, alle Prüfungen grün — und tat nichts, weil sein Cron-Eintrag an der falschen Stelle lag. Genau darauf sieht die Selbstprüfung heute zuerst."
K26 = "Die Wirkung eines Befehls"
K27 = "Mit eingeschalteter Wirkungsmessung liest das Plugin <b>vor</b> jedem Befehl die Position jeder Jalousie (Zustand <span class='sm-mono'>position</span>) und misst im Fünfminutentakt bis zu 30 Minuten nach. Die Kachel <i>zuletzt gesendet</i> im Reiter Test sagt dann, bei wie vielen Rollläden sich die Position danach geändert hat und wann das festgestellt wurde – im Raster des Takts, nicht auf die Sekunde. „Danach geändert“ heißt nicht „vom Befehl bewegt“: auch eine Hand am Taster ändert die Position."
K28 = "Wetter aus der Ecowitt-Weiche (ab Werk aus)"
K29 = "Eingeschaltet hält der Takt einen fälligen Befehl zurück, solange die Ecowitt-Weiche weniger Sonne meldet als die Mindeststrahlung oder mehr Wind (bzw. Böe) als den Höchstwert. Gefragt wird ihr Endpunkt <span class='sm-mono'>/plugins/ecowittweiche/live.php</span> auf diesem LoxBerry, mit ihrem Wortzeichen – nie ihre Dateien. Liefert sie zehn Minuten lang keinen brauchbaren Wert, gilt das bisherige Verhalten: der Befehl geht ohne Wetterbedingung hinaus, und der Reiter Test sagt es. <i>Befehl jetzt senden</i> und <span class='sm-mono'>aktion=jetzt</span> fragen kein Wetter."
K30 = "Wenn ein Feld beanstandet wird"
K31 = "Dann wird <b>nichts</b> gespeichert, auch nicht die übrigen Felder. Die eingetippten Werte stehen danach wieder im Formular, das beanstandete Feld ist rot umrandet und für Bildschirmleser als ungültig gekennzeichnet; das Wortzeichen der Ecowitt-Weiche reist dabei nicht mit. Still berichtigt wird nur Leerraum am Rand; ein leeres Thema im Reiter MQTT oder eine leere Miniserver-Wahl ist eine Beanstandung. <i>Einstellungen sichern</i> warnt, wenn in der gespeicherten Konfiguration ein Wert steht, den das Zurückspielen abweisen würde."
K32 = "Sonnenstand der Fensterbilanz (ab Werk aus)"
K33 = "Eingeschaltet lässt der Takt das A bei einem Ziel weg, solange die Fensterbilanz für jede diesem Ziel zugeordnete Fassade meldet, dass keine direkte Sonne auf ihre Fenster fällt. Gelesen werden ihre MQTT-Themen <span class='sm-mono'>haus/sonne/…</span> am Broker des LoxBerry – nie ihre Dateien; dazu hört ein kleiner Begleitprozess des Takts mit, der sich alle fünf Minuten erneuert. Die Fassade ist die Ausrichtung in ganzen Grad (z. B. <span class='sm-mono'>90</span> oder <span class='sm-mono'>90,180</span>), leer heißt: wie bisher. Ein weggelassenes Ziel holt der nächste Takt nach, sobald Sonne darauf fällt. Ist der letzte Satz älter als 15 Minuten, fehlt die Fassade darin oder schweigt die Fensterbilanz, gilt das bisherige Verhalten – das A wird gedrückt, und der Reiter Test sagt es. <i>Befehl jetzt senden</i> und <span class='sm-mono'>aktion=jetzt</span> fragen den Sonnenstand nicht."
K34 = "Befehle aus Loxone (Befehlsbrücke)"
K35 = "Mit dem Haken „Befehle über MQTT annehmen“ (Reiter MQTT, ab Werk aus) läuft die gemeinsame Befehlsbrücke als Dienst. Loxone schickt über den Ausgang „LoxBerry MQTT-Gateway“ <span class='sm-mono'>publish beschattung/befehl/jetzt 1</span> (das A drücken – nur bei eingeschaltetem Wächter) oder <span class='sm-mono'>…/pruefen 1</span> (Automatiken zählen). Die Brücke ruft dieselbe Funktion wie der HTTP-Endpunkt und die Knöpfe; ein zweiter Druck binnen einer Minute wird abgelehnt, die Antwort steht unter <span class='sm-mono'>…/quittung</span>."
K36 = "Anwesenheit (ab Werk aus)"
K37 = "Meldet der BLE-Scanner NG über <span class='sm-mono'>haus/anwesenheit/jemand</span>, dass niemand zu Hause ist, und bleibt es die eingestellte Frist (Vorgabe 10 Minuten) dabei, drückt der nächste Takt einmal je Abwesenheit das A, ohne den Abstand abzuwarten – nur bei eingeschaltetem Wächter, im Zeitfenster und unter den Wind- und Sonnenregeln. Schweigt die Quelle länger als zwei Minuten (Zähler <span class='sm-mono'>haus/anwesenheit/zaehler</span>) oder kommt „-“, gilt das bisherige Verhalten."
K38 = "Jalousie-Bausteine vorschlagen"
K39 = "Der Knopf im Reiter Einstellungen liest die Projektdatei des Miniservers und schlägt Zentralbausteine und Jalousien mit Automatik vor; das A nehmen laut Loxone genau diese beiden Bausteinarten an (Befehl auto). Die Auswahl füllt nur das Formular. Der Automatik-Designer der Loxone-App kann „auto“ ebenfalls zeitgesteuert schicken – ohne Zeitfenster, Abstand, Wetter, Sonne, Anwesenheit und Wirkungsmessung."
