; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der Hilfe.

[HILFE]
K01 = "Beschattungswächter"
K02 = "Am 24.08.2026 stand in diesem Haus die Sonne im Osten, die Beschattungsfreigabe war erteilt, alle achtzehn Räume forderten Beschattung — und keine einzige der 25 Rollladenautomatiken war scharf. Ein Druck auf das <b>A</b> im Zentralbaustein, und sechs Rollläden fuhren sofort auf 80 Prozent."
K03 = "Der Grund ist eine Eigenart des Loxone-Bausteins <i>Automatische Beschattung</i>: <b>die Sonnenstandsautomatik lässt sich aus der Logik heraus nicht einschalten.</b> Es gibt die Eingänge <span class='sm-mono'>Sps</span> (Start), <span class='sm-mono'>DisSp</span> (Sperre) und <span class='sm-mono'>Spr</span> (Reaktivierung nach Handbedienung) — aber keinen, der eine abgeschaltete Automatik zurückholt. Das kann nur der Befehl, den das A in der App absetzt."
K04 = "Und was sie abschaltet"
K05 = "Die Schaltuhr selbst. Sie fährt die Rollläden morgens über den Eingang <span class='sm-mono'>Co</span> (Complete open) hoch, und eine Bedienung über Co gilt für Loxone als <b>Handbedienung</b> — die schaltet die Sonnenstandsautomatik für den Rest des Tages ab. Das Haus schaltet sich also jeden Morgen seine eigene Beschattung aus, und niemand merkt es, solange die Freigabe ohnehin selten kommt."
K06 = "Was das Plugin tut"
K07 = "Es schickt in einem einstellbaren Abstand denselben Befehl an den Miniserver, den das A auslöst: <span class='sm-mono'>/dev/sps/io/&lt;Kennung&gt;/auto</span> am Zentralbaustein oder <span class='sm-mono'>/dev/sps/io/&lt;Kennung&gt;/autoshade/1</span> an einem einzelnen Rollladen. Der Befehl ist folgenlos, wenn die Automatik schon an ist."
K08 = "Das Passwort bleibt, wo es hingehört"
K09 = "Die Zugangsdaten des Miniservers holt das Plugin aus der <b>zentralen LoxBerry-Konfiguration</b> — dort, wo jedes Ihrer Plugins sie schon findet. Sie stehen weder in diesem Plugin noch in der Loxone-Projektdatei, und die Oberfläche zeigt sie nicht an. Das ist der Grund, warum dieser Weg über den LoxBerry läuft und nicht über einen virtuellen Ausgang in Loxone: dort müsste das Passwort in der Adresse stehen."
K10 = "Der Abstand ist eine Abwägung"
K11 = "Der Befehl holt auch eine Automatik zurück, die jemand <b>absichtlich</b> abgeschaltet hat. Wer einen Rollladen in der Sonne hochfährt, hat ihn sonst kurz darauf wieder unten. Sechzig Minuten sind lang genug, dass das im Alltag nicht stört, und kurz genug, dass eine Fassade, deren Sonne erst mittags kommt, den Tag nicht verpasst. Wer es anders will, ändert die Zahl — sie steht an einer einzigen Stelle."
K12 = "Einrichten"
K13 = "Im Reiter <i>Einstellungen</i> den Miniserver wählen, die Kennung des Bausteins eintragen und einschalten. Danach im Reiter <i>Test</i> auf <b>Befehl jetzt senden</b> — fahren daraufhin Rollläden oder wechselt in der App das A auf grün, ist der Weg in Ordnung. Ab dann übernimmt der Cron."
K14 = "Was das Plugin nicht tut"
K15 = "Es entscheidet <b>nicht</b>, ob beschattet wird. Das bleibt Sache der Loxone-Logik: Strahlung, Sonnenstand, Raumtemperatur, Freigabe. Das Plugin sorgt allein dafür, dass die Automatik überhaupt eingeschaltet ist — sonst rechnet die ganze Logik dahinter ins Leere."
K16 = "Der Rückweg: Loxone erfährt, ob der Wächter lebt"
K17 = "Bis zur Fassung 0.9.10 war das Plugin eine <b>Einbahnstraße</b> — es schickte Befehle und Loxone erfuhr nie, ob es noch läuft. Ein virtueller Eingang behält seinen letzten Wert; ein toter Wächter sah aus wie ein ruhiges Haus. Seit 0.9.11 gibt es einen Endpunkt im unangemeldeten Bereich, den der Miniserver ohne Zugangsdaten abfragen kann. Geschützt ist er durch ein <b>Merkwort</b>, das im Reiter <i>Einbindung in Loxone</i> steht. Dort stehen auch die Suchtexte für die virtuellen Eingänge und zwei Vorlagen zum Einlesen."
K18 = "MQTT als zweiter Weg"
K19 = "Über HTTP <i>holt</i> der Miniserver die Werte ab; über MQTT <i>schickt</i> das Plugin sie von sich aus — bei jedem Durchgang, auch wenn nichts zu senden war. Das Lebenszeichen unter <span class='sm-mono'>status/ok</span> geht immer hinaus. Der MQTT-Gateway gehört seit LoxBerry 3 zum System; bis zu seiner Fassung 1 muß das Abonnement dort von Hand eingetragen werden, ab Fassung 2 macht der Gateway das selbst. Beide Wege dürfen gleichzeitig laufen."
K20 = "Die Wirkung messen, nicht den Rückgabewert"
K21 = "<span class='sm-mono'>HTTP 200</span> heißt nur: der Miniserver hat den Befehl <i>angenommen</i>. Ob danach eine Automatik wirklich scharf ist, steht in einem anderen Zustand — <span class='sm-mono'>autoActive</span>. Das Plugin kann ihn für jede Jalousie abfragen und zählt dann, wie viele der gefundenen Automatiken scharf sind. Die Messung ist ab Werk <b>aus</b>: sie fragt je Jalousie mehrere Zustände ab, und auf einer großen Anlage ist das spürbare Last. Eingeschaltet läuft sie höchstens einmal je Viertelstunde."
K22 = "Einstellungen sichern und zurückspielen"
K23 = "Zwei Knöpfe im Reiter <i>Einstellungen</i>. Die Sicherungsdatei trägt auch das <b>Merkwort</b> des Endpunkts — ohne das wäre sie nach dem Zurückspielen wertlos: alle in Loxone eingetragenen Adressen wären ungültig, und der Miniserver bekäme auf jede Abfrage eine 403. Wer die Datei weitergibt, gibt damit den Schlüssel zu diesem Endpunkt weiter. Zurückgespielt wird nur, was dieselbe Prüfung besteht wie eine Eingabe im Formular; alles Übrige wird benannt und verworfen."
K24 = "Wenn etwas nicht stimmt"
K25 = "Der Reiter <i>Test</i> prüft sich selbst und sagt bei jeder Zeile auch, wenn er etwas <b>nicht feststellen konnte</b> — ein Kreuz, das nichts bedeutet, ist schlimmer als keine Prüfung. Zusätzlich meldet sich das Plugin bei LoxBerry selbst: die Systemseite zeigt ein Ampelzeichen, und dieselbe Meldung geht über MQTT hinaus. Am 24.08.2026 stand dieses Plugin vollständig installiert da, alle Prüfungen grün — und tat nichts, weil sein Cron-Eintrag an der falschen Stelle lag. Genau darauf sieht die Selbstprüfung heute zuerst."
