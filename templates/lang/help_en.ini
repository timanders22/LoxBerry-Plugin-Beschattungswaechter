; Help texts, English. Belongs to templates/help/help.html.

[HILFE]
K01 = "Shading Watchdog"
K02 = "On 24 August 2026 the sun stood in the east of this house, the shading release was granted, all eighteen rooms asked for shading — and not one of the 25 blind automatics was armed. One press on the <b>A</b> of the central block, and six blinds went to 80 percent immediately."
K03 = "The reason is a property of the Loxone <i>Automatic Shading</i> block: <b>the sun position automatic cannot be switched on from the logic.</b> There are inputs <span class='sm-mono'>Sps</span> (start), <span class='sm-mono'>DisSp</span> (disable) and <span class='sm-mono'>Spr</span> (reactivate after manual operation) — but none that brings back an automatic that has been switched off. Only the command behind the A in the app does that."
K04 = "And what switches it off"
K05 = "The timer itself. In the morning it opens the blinds through input <span class='sm-mono'>Co</span> (Complete open), and Loxone counts operation via Co as <b>manual</b> — which disables the sun position automatic for the rest of the day. So the house switches off its own shading every morning, and nobody notices as long as the release rarely comes anyway."
K06 = "What the plugin does"
K07 = "At a configurable interval it sends the Miniserver the same command the A triggers: <span class='sm-mono'>/dev/sps/io/&lt;id&gt;/auto</span> on the central block, or <span class='sm-mono'>/dev/sps/io/&lt;id&gt;/autoshade/1</span> on a single blind. The command has no effect if the automatic is already on."
K08 = "The password stays where it belongs"
K09 = "The plugin takes the Miniserver credentials from the <b>central LoxBerry configuration</b> — where every one of your plugins already finds them. They are neither in this plugin nor in the Loxone project file, and the interface does not show them. That is why this route runs through the LoxBerry and not through a virtual output in Loxone, where the password would have to sit in the address."
K10 = "The interval is a trade-off"
K11 = "The command also restores an automatic somebody switched off <b>on purpose</b>. Raise a blind in the sun, and it would otherwise be back down shortly after. Sixty minutes is long enough not to be a nuisance and short enough that a facade whose sun arrives at noon does not miss the day."
K12 = "Setting it up"
K13 = "On the <i>Settings</i> tab choose the Miniserver, enter the block identifier and enable it. Then press <b>Send command now</b> on the <i>Test</i> tab — if blinds move or the A in the app turns green, the path works. From then on the cron takes over."
K14 = "What the plugin does not do"
K15 = "It does <b>not</b> decide whether to shade. That stays with the Loxone logic: radiation, sun position, room temperature, release. The plugin only makes sure the automatic is switched on at all — otherwise all that logic computes into the void."
K16 = "The way back: Loxone learns whether the watcher is alive"
K17 = "Up to version 0.9.10 the plugin was a <b>one-way street</b> — it sent commands and Loxone never learned whether it was still running. A virtual input keeps its last value; a dead watcher looked like a quiet house. Since 0.9.11 there is an endpoint in the unauthenticated area that the Miniserver can query without credentials. It is protected by a <b>secret</b>, shown on the <i>Wiring it into Loxone</i> tab. The command recognitions for the virtual inputs are there too, along with two templates to import. The field <span class='sm-mono'>OK</span> goes to 0 as soon as the last pass of the cycle is more than 15 minutes old (three times the five-minute cycle); <span class='sm-mono'>LAUFALTER</span> gives that age in seconds and is the field for failure detection in Loxone. Before the first pass the endpoint answers HTTP 503."
K18 = "MQTT as a second road"
K19 = "Over HTTP the Miniserver <i>fetches</i> the values; over MQTT the plugin <i>pushes</i> them by itself. The three topics under <span class='sm-mono'>status</span> go out on every pass, even when there was nothing to send; enabled, targets and time window also go out as soon as one of them changes, and right after saving. The MQTT gateway has been part of the system since LoxBerry 3. The plugin maintains the subscription itself in the file <span class='sm-mono'>mqtt_subscriptions.cfg</span> in its configuration folder, which the gateway reads in version 1; from version 2 on the gateway enters subscriptions itself anyway. Changing the prefix or switching MQTT off clears the retained topics of the previous prefix, and the plugin asks the broker whether they are gone. Both roads may run at the same time."
K20 = "Measure the effect, not the return value"
K21 = "<span class='sm-mono'>HTTP 200</span> only means the Miniserver <i>accepted</i> the command. Whether an automation is actually armed afterwards lives in a different state — <span class='sm-mono'>autoActive</span>. The plugin can query it for every blind and then counts how many of the automations it found are armed. The measurement is <b>off</b> by default: it queries several states per blind, and on a large installation that is noticeable load. Switched on, it runs at most once every quarter of an hour. As long as nothing has been measured or the measurement is off, <span class='sm-mono'>SCHARF</span> and <span class='sm-mono'>AUTOMATIKEN</span> show a dash. If a count fails, the last counted values stay, and <span class='sm-mono'>OK</span> goes to 0 until a count succeeds again."
K22 = "Backing up the settings and restoring them"
K23 = "Two buttons on the <i>Settings</i> tab. The backup file also carries the endpoint's <b>secret</b> — without it the file would be worthless after a restore: every address entered in Loxone would be invalid, and the Miniserver would get a 403 on every query. Passing the file on therefore means passing on the key to this endpoint. Only a complete file whose values all pass the same check as a form entry is restored. If a setting is missing, an unknown one is present or a value is invalid, the whole file is rejected, every reason is named, and nothing changes. Backups from versions before 0.9.11 do not know the secret and the Miniserver choice yet and are therefore rejected. An empty secret in the file means none was backed up – then the current one is kept, and the message says so."
K24 = "When something is wrong"
K25 = "The <i>Test</i> tab checks itself and says on every line when it <b>could not establish</b> something — a cross that means nothing is worse than no check at all. The plugin also reports to LoxBerry itself: the system page shows a traffic light, and the same message goes out over MQTT. On 24.08.2026 this plugin sat there fully installed, every check green — and did nothing, because its cron entry was in the wrong place. That is exactly what the self-check now looks at first."
K26 = "The effect of a command"
K27 = "With effect measurement enabled, the plugin reads the position of every blind (state <span class='sm-mono'>position</span>) <b>before</b> each command and re-measures on the five-minute cycle for up to 30 minutes. The tile <i>last sent</i> on the Test tab then says on how many blinds the position changed afterwards and when that was detected – on the grid of the cycle, not to the second. “Changed afterwards” does not mean “moved by the command”: a hand on the switch changes the position too."
K28 = "Weather from the Ecowitt switch (off by default)"
K29 = "When enabled, the cron cycle holds back a due command while the Ecowitt switch reports less sun than the minimum radiation or more wind (or gust) than the maximum. It queries the endpoint <span class='sm-mono'>/plugins/ecowittweiche/live.php</span> on this LoxBerry with its token – never its files. If it delivers no usable value for ten minutes, the previous behaviour applies: the command goes out without a weather condition, and the Test tab says so. <i>Send command now</i> and <span class='sm-mono'>aktion=jetzt</span> do not ask for the weather."
K30 = "When a field is rejected"
K31 = "Then <b>nothing</b> is saved, not the other fields either. What you typed is back in the form afterwards, the rejected field outlined in red and marked as invalid for screen readers; the token of the Ecowitt switch does not travel along. Only leading and trailing whitespace is corrected silently; an empty topic on the MQTT tab or an empty Miniserver choice is rejected. <i>Back up settings</i> warns when the saved configuration holds a value a restore would reject."
