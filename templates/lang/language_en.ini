ERLAEUTERUNG = "<b>On {B5}:</b> The sign of life counts up by one in every cycle; if it stands still for five cycles (1500 s), the analog value validation reports – single lost UDP datagrams do not. The constant {B33} keeps “En” on; remove the tick at “En” in the properties.<br><b>On {B7}, {B34} and {B35}:</b> SCHARF and AUTOMATIKEN carry a number only with the box ‘Measure the effect’, otherwise -1, and the comparison stays silent. Counting runs every 15 minutes inside the time window – {B7} therefore also sees manual operation and the morning opening via Co; a message only comes when an automatic stays off inside the time window longer than the interval plus 20 minutes.<br><b>On {B8} and {B9}:</b> Three cases, but an OR has only two inputs – hence two ORs in a row.<br><b>On {B12} and {B32}:</b> commands on the shared output “LoxBerry MQTT-Gateway”; they work only with the box “Accept commands over MQTT” in the plugin. The blocks are named after their names in Loxone Config; the circuit is built in Loxone Config in the LoxBerry-Plugins sample project but not tested in operation."
