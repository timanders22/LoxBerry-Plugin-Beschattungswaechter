ERLAEUTERUNG = "<b>On {B2}:</b> LAUFALTER measures the cycle, not the last command. ALTER is regularly many hours old at night and with a long interval, so it is no use for monitoring. Before the first pass the endpoint answers HTTP 503; Loxone then keeps the last values and shows the input as faulty.<br><b>On {B4}:</b> SCHARF and AUTOMATIKEN only carry a number while counting is switched on; otherwise they show a dash, and the comparison stays silent.<br><b>On {B5} and {B6}:</b> Three cases, but an OR has only two inputs – hence two OR blocks in a row.<br><b>On {B8}:</b> <i>Send command now</i> acts regardless of time window and interval. The template only carries the command <i>Count automatics</i> while counting is switched on; do not trigger it more often than every 15 minutes. Both addresses carry the keyword – after a new keyword import the templates again.<br>The blocks carry their Loxone Config names; the circuit has not been tried out in Loxone Config."
