S4_T = "Create a virtual HTTP input"
S4 = "In Loxone Config create a Virtual HTTP Input, enter the address from step 2 and set the polling cycle to 60 seconds. Below it one input per field, with the command recognition from step 3. Faster than 60 seconds gains nothing - the watcher runs every five minutes. Until the first pass of the cycle the endpoint answers HTTP 503; Loxone then shows the input as faulty."
S6_T = "Import the templates"
S6 = "The two templates bring the HTTP input from step 4 and the commands from step 2 ready-made. They save the typing, not the understanding."
IMPORT_WARNUNG = "The templates carry the secret. Create a new one and they must be imported again - the imported addresses still carry the old one."
