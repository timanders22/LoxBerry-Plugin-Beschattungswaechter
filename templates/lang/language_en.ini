[MQTT]
WARUM = "The second road to Loxone. Over HTTP the Miniserver fetches the values; over MQTT the plugin pushes them by itself - even when there was nothing to send. Both may run at the same time."
KEIN_GENERAL = "The central LoxBerry configuration could not be read. Nothing can be said about the MQTT gateway here - neither that it runs nor that it is missing."
EIGENSCHAFT = "Property"
AUTOSTART = "Gateway starts with the system"
FASSUNG = "Gateway version"
UDPPORT = "UDP inbound port of the gateway"
UNBEKANNT = "not readable"
AUTOSTART_WARNUNG = "The MQTT gateway is not set to autostart. This plugin's lines then go nowhere: sending over UDP reports success even when nobody is listening. Set it under Settings, MQTT Gateway."
L_EIN = "Also publish the values over MQTT"
H_EIN = "Off means nothing is published. The HTTP road is unaffected."
H_THEMA = "Required, the default is beschattung. Letters, digits, underscore, hyphen and slash are allowed. An empty field is rejected, not silently replaced."
H_ABO = "The subscription"
ABO_PFLICHT = "This subscription must be entered in the MQTT gateway by hand, under Subscriptions. Without that entry the values arrive at the gateway and go no further, and Loxone stays quiet."
ABO_V2 = "From version 2 on the gateway enters subscriptions itself; the input field is disabled there. Nothing needs to be done."
H_THEMEN = "What is published"
THEMA = "Topic"
BEDEUTUNG = "Meaning"
T_RETAIN = "Retained"
RETAIN_JA = "yes"
RETAIN_NEIN = "no"
RETAIN_ERKLAERUNG = "Retained means the broker keeps the last value, so Loxone has it again immediately after the Miniserver or the broker restarts. That applies to values that stay true after the runs have stopped – switch position, number of targets, number of commands sent, the measured automatics (a dash without a measurement). Not retained are the heartbeat, everything the watcher says about itself (OK, consecutive errors, HTTP code), and the time window, which becomes wrong by the clock alone: after the runs stop they would otherwise stand there forever and look like a running, error-free watcher."
H_LEBEN = "The three topics under status go out on EVERY pass, even when nothing was sent. Otherwise a dead watcher cannot be told from a quiet house: a virtual input keeps its last value. Enabled, targets and time window also go out as soon as one of them changes, at least every 30 minutes and right after saving – outside the time window as well."
LAEUFT = "starts with the system"
LAEUFT_NICHT = "no autostart"
