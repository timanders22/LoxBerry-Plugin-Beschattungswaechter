H_PRUEFEN = "Asks the Miniserver for the state autoActive of every blind (at most 40): inside the time window with the watchdog switched on every 15 minutes, even without a command, and after every command – at most once per quarter of an hour. Switched on, the plugin also reads the position of every blind before each command and re-measures in the cycle for up to 30 minutes – the tile “last sent” on the Test tab tells whether and when a position changed afterwards. Off by default: on a large installation this is noticeable load."
H_ZAEHLEN = "Measuring the effect"
H_ZAEHLEN_ERKL = "HTTP 200 means: the Miniserver accepted the command. Whether an automatic is really armed afterwards is a different state - autoActive. Inside the time window it is counted every 15 minutes (autoActive only); this button counts at once and also reads the reason for every blind."
