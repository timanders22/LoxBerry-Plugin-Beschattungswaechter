WAS_IST_DAS = "<b>Presses the A at an adjustable interval – the button that switches on the sun position automatic in Loxone and that otherwise only a person can press.</b> To do so, the plugin sends the command auto to up to six targets on the Miniserver, only within the configured time window and at most once per interval, using the credentials from the central LoxBerry configuration. The result goes back to Loxone through an endpoint the Miniserver queries without credentials, and optionally over MQTT. It does not decide whether to shade – that stays with the Loxone logic."

