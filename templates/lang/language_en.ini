A_S1 = "In the plugin, tab “{L:REITER.EINSTELLUNGEN}”: press “{L:TEXT.K_VORSCHLAG}” and take over the central block (or the single blinds) – or enter the identifier yourself at “{L:TEXT.L_UUID}” (command auto). Tick “{L:TEXT.L_AKTIV}”. If you want the count of armed automatics ({B3}, {B4}, {B23}, {B31}, {B32}): tick “{L:TEXT.L_PRUEFEN}”. Save."
A_S2 = "In the plugin, tab “MQTT”: tick “{L:MQTT.L_EIN}” (on by default for a new installation) and, for the two commands {B12}/{B32}, “{L:BEFEHL.L_ANNEHMEN}”, save. Gateway version 2: on the subscription page of the gateway tick the boxes from the list on the MQTT tab, “Noncached” for status/ok and ziele."
A_S3 = "In Loxone Config the inputs of the gateway appear under Periphery → Virtual inputs with the names from the table above (step 2). Do not tick “Use as digital input”; give the LoxBerry user rights."
A_S4 = "Create a new page “Beschattungswächter” and drag the eleven inputs onto it ({B1}–{B4}, {B13}–{B16}, {B18}–{B20})."
A_S5 = "Create three virtual inputs (Periphery → Virtual inputs → Virtual input, “Use in visualisation” on): push buttons “BW Befehl jetzt” ({B11}) and “BW Automatiken jetzt zählen” ({B31}); switch (start value off) “Beschattungsfreigabe (eigene Quelle)” ({B27})."
A_S6 = "On the output “LoxBerry MQTT-Gateway” (Periphery → Virtual outputs, address /dev/udp/&lt;LoxBerry&gt;/11884) create two virtual output commands: {B12} and {B32} with the command on ON from the list, never “retain”. Create two notifications: “BW Meldung” ({B10}) and “BW ohne Ziel” ({B26})."
A_S7 = "Place the remaining blocks via the block search (<b>F5</b>) and enter the parameters from the list: analog value validation, constant, threshold switch, greater, equal, AND, 3 OR, 3 status, formula, 2 on-delays, off-delay, edge detection. Status: lines in the given order, the line without condition last; inputs from V5 on appear only after a click on the “+”."
A_S8 = "Connect from top to bottom. An OR and an AND have exactly two inputs. Important: “BW Befehl jetzt senden” ({B12}) gets its wire from the OR {B30}; {B5} hangs on the output error."
A_S9 = "Own source: also connect the wire that is on input “Sps” (start sun position automatic) of your automatic shading to {B28} “BW Freigabe beruhigt” and delete the switch {B27}. Without an own release {B27} stays as a manual switch."
A_S10 = "Save and transfer to the Miniserver; at system start have “reconnect” sent to the gateway (page “LoxBerry MQTT-Gateway” in the sample project)."
A_S11 = "Test: press “BW Befehl jetzt” in the app – the blinds in the sun move, “BW Letzter Befehl” shows “accepted 0 min ago (HTTP 200)” within five minutes. With the box “{L:TEXT.L_PRUEFEN}”: press “BW Automatiken jetzt zählen” – “BW Automatiken” shows “… automations armed”."
H_START = "In the first minutes after the transfer the virtual inputs stand at 0 until the first value comes through the gateway (at most 5 minutes; status_ok and ziele right after a reconnect thanks to “Noncached”). “BW ohne Ziel” reports only after 15 min."
H_JETZT = "“BW Befehl jetzt” and the release press the A immediately – regardless of the time window, interval, weather and sun position of the plugin. With the watchdog switched off the plugin rejects; a second press within one minute is rejected."
H_HAND = "A blind that somebody raises by hand in the sun stays up until the next command: in the cycle at the earliest after the interval (default 60 min), via the release only once it has been gone for more than 1 h ({B28})."
H_SPERRE = "Blocking the shading (window cleaning, a party, wind) belongs at the automatic shading (input DisSp or the lock), not in the plugin."
H_ALLE = "“BW Automatiken” counts every blind block with automatic in the project (at most 40). If you have blinds that deliberately never shade, it permanently shows “… of … armed”, and “BW Meldung” ({B10}) reports via {B35} – then detach {B35} from {B9} or leave the box “{L:TEXT.L_PRUEFEN}” unticked."
BT_VIM = "Virtual input (name as the MQTT gateway assigns it, plugin Beschattungswächter)"
BT_GWA = "Virtual output command (template “LoxBerry MQTT-Gateway”, MQTT)"
B33_TYP = "Constant"
B33_PARAM = "value 1"
B33_VERB = "—"
B34_TYP = "AND"
B34_PARAM = "— (at night the last count stays and does not report)"
B34_VERB = "I1 = {B7}, I2 = {B15}"
B35_TYP = "On-delay"
B35_PARAM = "4800 s (interval in the plugin, factory 60 minutes, plus 20 minutes: that long the next command brings back a manual operation; whoever changes the interval in the plugin sets the new interval plus 20 minutes here)"
B35_VERB = "Input = {B34}"
H_DESIGNER = "The automation designer of the Loxone app can send “auto” to the central block on a schedule – without time window, interval, weather, sun, presence and measurement of the effect. If both run, the house presses the A twice (harmless)."

[BEFEHL]

TITEL = "Commands from Loxone (MQTT)"
