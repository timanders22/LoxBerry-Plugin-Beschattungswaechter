H_SONNE = "Sun position from the window balance (off by default)"
H_SONNE_ERKL = "When enabled, the cron cycle leaves out the A for a target as long as the window balance (Fensterbilanz) reports for <b>every</b> facade assigned to it that no direct sun falls on its windows – without sun the command only brings back automations somebody switched off on purpose. As soon as the sun reaches it, the next cycle catches up on the A. The plugin reads the MQTT topics of the window balance under haus/sonne/ (switch on Sun position for other plugins on its MQTT tab there) – never its files. Send command now and aktion=jetzt do not ask for the sun position."
