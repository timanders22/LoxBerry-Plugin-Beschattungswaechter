H_ANWESEND_ERKL = "Reads haus/anwesenheit/jemand from BLE-Scanner NG (there “Share presence with other plugins”). If it reports that nobody is at home and this lasts for the delay, the next cycle presses the A once per absence without waiting for the interval – whoever is away does not intervene by hand. Only with the watchdog switched on, inside the time window and under the wind and sun rules. If the source is silent for more than two minutes or reports no statement, the previous behaviour applies – the Test tab says so."
L_ANWESEND_EIN = "When nobody is at home, press the A earlier"
L_ANWESEND_FRIST = "Delay (minutes, 5 to 120)"
