KEIN_GENERAL = "The central LoxBerry configuration could not be read. Nothing can be said about the MQTT gateway here - neither that it runs nor that it is missing."
EIGENSCHAFT = "Property"
AUTOSTART = "Gateway starts with the system"
FASSUNG = "Gateway version"
UDPPORT = "UDP inbound port of the gateway"
UNBEKANNT = "not readable"
AUTOSTART_WARNUNG = "The MQTT gateway is not set to autostart. This plugin's lines then go nowhere: sending over UDP reports success even when nobody is listening. Set it under Settings, MQTT Gateway."
L_EIN = "Also publish the values over MQTT"
H_EIN = "Off means nothing is published. The HTTP road is unaffected."
H_THEMA = "Leaving it empty is enough. The host name then goes in front, exactly as the gateway does for every other plugin."
H_ABO = "The subscription"
ABO_PFLICHT = "This subscription must be entered in the MQTT gateway by hand, under Subscriptions. Without that entry the values arrive at the gateway and go no further, and Loxone stays quiet."
