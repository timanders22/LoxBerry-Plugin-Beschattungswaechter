; Beschattungswaechter - English
;
; Every key used here must also exist in language_de.ini.
; Put every value in double quotes: with parse_ini_file a semicolon starts a
; comment, and every HTML entity ends with one.

[ALLGEMEIN]
TITEL = "Shading Watchdog"

[REITER]
EINSTELLUNGEN = "Settings"
TEST = "Test"
PROTOKOLL = "Log"

[LEGENDE]
AKTION = "acts on the installation"

[TEXT]
WARUM = "In Loxone the sun position automatic of a blind cannot be switched on from the logic: the A in the app is a command, not a block input. At the same time the timer switches it off every morning - it opens the blinds through input Co, and Loxone counts that as manual operation. This plugin presses the A from outside, at a configurable interval."
H_EINSTELLUNGEN = "Settings"
L_AKTIV = "Enabled"
H_AKTIV = "Off means the cron keeps running but sends nothing. For trying things out without uninstalling."
L_MS = "Miniserver"
H_MS = "From the central LoxBerry configuration. The password lives there, not in this plugin - it is neither shown nor stored here."
KEIN_MS = "no Miniserver configured"
L_UUID = "Block identifier"
H_UUID = "The UUID of the central shading block or of a single blind. The Loxone app shows it in the address, the project file in the block attribute U."
L_BEFEHL = "Command"
H_BEFEHL = "On the central block the command is auto, on a single blind autoshade/1. Both switch the sun position automatic on; noauto and autoshade/0 switch it off."
L_VON = "From"
L_BIS = "To"
L_ABSTAND = "Interval (minutes)"
H_FENSTER = "Sent only inside the time window and at most once per interval. 60 minutes is a trade-off: the command also restores an automatic that was switched off by hand, and someone who raises a blind in the sun should not have it back down ten minutes later."
SPEICHERN = "Save settings"
GESPEICHERT = "Settings saved."
KENNUNG_UNGUELTIG = "Identifier or command rejected: only letters, digits, dot, hyphen and underscore are allowed. Nothing was saved."
H_TEST = "Test"
K_LETZTE = "last sent"
K_GESENDET = "commands in total"
K_FEHLER = "consecutive errors"
K_FENSTER = "inside the window"
JA = "yes"
NEIN = "no"
JETZT = "Send command now"
H_JETZT = "Sends immediately, ignoring window and interval. If blinds move afterwards, the path works."
ERGEBNIS = "Result"
ANTWORT = "Response"
GESENDET = "sent"
FEHLGESCHLAGEN = "failed"
PRUEFPUNKT = "Check"
GEMESSEN = "measured"
H_SELBST = "Self-check"
S_REITER = "Tab bar, panes and positive list carry the same names"
S_LAUF = "The cron worker is in place"
S_MS = "LoxBerry knows a Miniserver"
S_SCHREIBBAR = "The configuration can be written"
S_OK = "in order"
S_NOK = "finding"
S_NICHT_GEFUNDEN = "not found"
H_PROTOKOLL = "Log"
H_PROTOKOLL_HILFE = "Only the first command of the day and every error are recorded, not every run. A quarter-hourly cycle would otherwise produce a hundred lines a day, burying the one that matters."
PROTOKOLL_LEER = "Nothing recorded yet."
S_CRON = "The cron entry is in place"
S_CRON_ORDNER = "there is a directory instead of a file - LoxBerry only runs files"
S_REST = "leftover from an earlier version in cron.15min - may be deleted"
