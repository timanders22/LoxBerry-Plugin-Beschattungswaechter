P_FASSADE = "e.g. 90 or 90,180"
H_SONNE_FELDER = "Per target the orientation of the facade(s) in whole degrees, as the window balance names them (topics haus/sonne/fassade/&lt;degrees&gt;/wirkt, list in haus/sonne/fassaden): 0 to 359, several separated by a comma without spaces, at most eight. For the central block enter all facades – it is only left out when no sun falls on any of them. Empty means: this target is pressed as before. If no set of the window balance arrives for %d minutes, a facade is missing in it or the window balance is not installed, the previous behaviour applies: the A is pressed, and the Test tab says so."
