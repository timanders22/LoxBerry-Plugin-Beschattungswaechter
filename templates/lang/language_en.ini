S2_T = "Know the endpoint"
S2 = "The plugin answers the Miniserver at this address - without a login, but only with the secret. The address is needed in step 4."
ADRESSE = "Address"
MERKWORT = "Secret"
KEIN_TOKEN = "none set up yet"
MERKWORT_WARNUNG = "The secret is this endpoint's only protection. A new one invalidates every address already entered in Loxone - they have to be entered again."
K_TOKEN = "Create a new secret"
S3_T = "The fields of the status line"
S3 = "The endpoint answers with one line of fields. Each field gets a virtual input in Loxone; the command recognition is next to it and is copied exactly as it stands - leading semicolon included."
FELD = "Field"
CHECK = "Command recognition"
EINHEIT = "Unit"
BEDEUTUNG = "Meaning"
CHECK_HILFE = "The leading semicolon is mandatory. Loxone searches literally and takes the first hit: without the separator the pattern for ALTER would first find the field name ending in it."
S4_T = "Create a virtual HTTP input"
S4 = "In Loxone Config create a Virtual HTTP Input, enter the address from step 2 and set the polling cycle to 60 seconds. Below it one input per field, with the command recognition from step 3. Faster than 60 seconds gains nothing - the watcher runs every five minutes."
S5_T = "The alarms in the program"
S5 = "Four blocks are enough to notice that something is wrong. Without them a dead watcher is only noticed when the blinds stop moving in summer."
