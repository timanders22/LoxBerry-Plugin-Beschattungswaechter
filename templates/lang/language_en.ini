WAS_IST_DAS = "<b>Presses the A at an adjustable interval – the button that switches on the sun position automatic in Loxone and that the Loxone logic cannot press.</b> The plugin sends the command auto to up to six targets on the Miniserver, only inside the time window and at most once per interval, with the credentials from the central LoxBerry configuration. Values go back to Loxone through the MQTT gateway; on request the command bridge accepts commands from Loxone. It does not decide whether to shade – that stays with the Loxone logic. The automation designer of the Loxone app can send “auto” on a schedule – without time window, interval, weather, sun, presence and measurement of the effect."
