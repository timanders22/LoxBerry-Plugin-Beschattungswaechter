[BAUSTEIN]
H = "Komplette Baustein-Liste zum 1:1-Nachbauen"
TEXT = "Jede Zeile ist ein Baustein; wer von oben nach unten abarbeitet, hat alles nachgebaut. Die Liste ist die Seite „Beschattungswächter“ im LoxBerry-Plugins Musterprojekt: die Werte als Virtuelle Eingänge des MQTT-Gateways, die Meldungen und Anzeigen in der Logik – ohne sie fällt ein toter Wächter erst auf, wenn im Sommer die Rollläden nicht mehr fahren –, die beiden Befehle am Ausgang „LoxBerry MQTT-Gateway“ und der Anlass „Beschattung beginnt“, der das A sofort drückt, wenn die Beschattung freigegeben wird. Alle Bausteine findet Loxone Config über die Baustein-Suche (<b>F5</b>). Jede Zeile bezieht sich nur auf kleinere Nummern – bis auf {B5}, {B9} und {B12}."
T_TYP = "Baustein (Typ)"
T_NAME = "Name (Vorschlag)"
T_PARAM = "Parameter"
T_VERB = "Eingänge verbinden mit"
ERLAEUTERUNG = "<b>Zu {B5}:</b> Das Lebenszeichen zählt bei jedem Takt eins weiter; bleibt es fünf Takte (1500 s) stehen, meldet die Analogwertvalidierung – einzelne verlorene UDP-Datagramme melden so nichts. Die Konstante {B33} hält „En“ an; den Haken bei „En“ im Eigenschaftsfenster entfernen.<br><b>Zu {B7}, {B34} und {B35}:</b> SCHARF und AUTOMATIKEN tragen nur mit dem Haken ‚Die Wirkung messen‘ eine Zahl, sonst -1, und der Vergleich schweigt. Gezählt wird im Zeitfenster alle 15 Minuten – {B7} sieht damit auch eine Handbedienung und die morgendliche Öffnung über Co; gemeldet wird erst, wenn eine Automatik im Zeitfenster länger als Abstand plus 20 Minuten abgeschaltet bleibt.<br><b>Zu {B8} und {B9}:</b> Drei Fälle, aber ein ODER hat nur zwei Eingänge – deshalb zwei ODER hintereinander.<br><b>Zu {B12} und {B32}:</b> Befehle am gemeinsamen Ausgang „LoxBerry MQTT-Gateway“; sie wirken nur mit dem Haken „Befehle über MQTT annehmen“ im Plugin. Die Bausteine sind nach ihren Namen in Loxone Config benannt; die Schaltung ist im LoxBerry-Plugins Musterprojekt in Loxone Config gebaut, im Betrieb aber nicht erprobt."
B1_PARAM = "Lebenszeichen: zählt bei jedem Fünfminutentakt des Plugins eins weiter, 0 bis 999, läuft um – auch nachts und wenn nichts gesendet wird; nie zurückbehalten; Fassung 2: Haken"
