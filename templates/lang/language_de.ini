[TEXT]
WARUM = "In Loxone lässt sich die Sonnenstandsautomatik eines Rollladens aus der Logik heraus nicht einschalten: das A in der App ist ein Befehl, kein Eingang am Baustein. Gleichzeitig schaltet die Schaltuhr sie jeden Morgen ab - sie fährt die Rollläden über den Eingang Co hoch, und das gilt für Loxone als Bedienung von Hand. Dieses Plugin drückt das A von außen, in einem einstellbaren Abstand."
H_EINSTELLUNGEN = "Einstellungen"
L_AKTIV = "Eingeschaltet"
H_AKTIV = "Aus heißt: der Cron läuft weiter, sendet aber nichts. Zum Ausprobieren ohne Deinstallieren."
L_MS = "Miniserver"
H_MS = "Aus der zentralen LoxBerry-Konfiguration. Das Passwort steht dort und nicht in diesem Plugin - es wird weder angezeigt noch gespeichert."
KEIN_MS = "kein Miniserver eingerichtet"
L_UUID = "Kennung des Bausteins"
H_UUID = "Die UUID des Zentralbausteins Beschattung oder eines einzelnen Rollladens. In der Loxone-App steht sie in der Adresse, in der Projektdatei im Attribut U des Bausteins. Ab Werk steht hier der Zentralbaustein dieses Hauses."
L_BEFEHL = "Befehl"
H_BEFEHL = "Am Zentralbaustein heißt der Befehl auto, am einzelnen Rollladen autoshade/1. Beides schaltet die Sonnenstandsautomatik ein; noauto und autoshade/0 schalten sie aus."
L_VON = "Von"
L_BIS = "Bis"
L_ABSTAND = "Abstand (Minuten)"
H_FENSTER = "Gesendet wird nur innerhalb des Zeitfensters und höchstens einmal je Abstand. 60 Minuten sind eine Abwägung: der Befehl holt auch eine von Hand abgeschaltete Automatik zurück, und wer einen Rollladen in der Sonne hochfährt, soll ihn nicht nach zehn Minuten wieder unten haben."
