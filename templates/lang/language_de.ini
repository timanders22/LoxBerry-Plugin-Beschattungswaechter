ERLAEUTERUNG = "<b>Zu {B2}:</b> LAUFALTER misst den Takt, nicht den letzten Befehl. ALTER ist nachts und bei großem Abstand regulär viele Stunden alt und taugt deshalb nicht als Überwachung. Vor dem ersten Durchgang antwortet der Endpunkt mit HTTP 503; Loxone behält dann die letzten Werte und zeigt den Eingang als gestört.<br><b>Zu {B4}:</b> SCHARF und AUTOMATIKEN tragen nur bei eingeschalteter Zählung eine Zahl; sonst steht dort ein Strich, und der Vergleich schweigt.<br><b>Zu {B5} und {B6}:</b> Drei Fälle, aber ein Oder hat nur zwei Eingänge – deshalb zwei Oder hintereinander.<br><b>Zu {B8}:</b> <i>Befehl sofort senden</i> wirkt ohne Rücksicht auf Zeitfenster und Abstand. Den Befehl <i>Automatiken zählen</i> trägt die Vorlage nur bei eingeschalteter Zählung; nicht öfter als alle 15 Minuten auslösen. Beide Adressen tragen das Merkwort – nach einem neuen Merkwort die Vorlagen neu einlesen.<br>Die Bausteine sind nach ihren Namen in Loxone Config benannt; die Schaltung ist nicht in Loxone Config erprobt."
