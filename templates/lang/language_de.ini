; Beschattungswächter - Deutsch
;
; Jeder hier benutzte Schlüssel muss auch in language_en.ini stehen.
; Jeden Wert in doppelte Anführungszeichen setzen: bei parse_ini_file
; beginnt mit ; ein Kommentar, und jede HTML-Entität endet auf ein
; Semikolon. Innerhalb eines Wertes darf kein doppeltes Anführungszeichen
; stehen - HTML-Attribute deshalb einfach quoten: <span class='sm-mono'>.
;
; Umlaute stehen als echte UTF-8-Zeichen da, nicht als Entität. Das ist
; keine Geschmacksfrage: eine Entität in einem Wert, der maskiert
; ausgegeben wird, erscheint im Browser wörtlich.

