B31_TYP = "Virtueller Eingang (Taste)"
B31_PARAM = "in der App; misst höchstens einmal je 15 min neu, sonst kommt die letzte Messung"
B31_VERB = "—"
B32_PARAM = "Befehl bei EIN: %s (nie retain); wirkt nur mit dem Haken „Befehle über MQTT annehmen“ (Reiter MQTT) und ‚Die Wirkung messen‘ (Reiter Einstellungen); misst höchstens einmal je 15 Minuten neu; die Antwort steht unter %s"
B32_VERB = "Eingang = {B31}"
A_S1 = "Im Plugin Reiter „{L:REITER.EINSTELLUNGEN}“: „{L:TEXT.K_VORSCHLAG}“ drücken und den Zentralbaustein (oder die einzelnen Rollläden) übernehmen – oder bei „{L:TEXT.L_UUID}“ die Kennung selbst eintragen (Befehl auto). „{L:TEXT.L_AKTIV}“ setzen. Wer die Zählung der scharfen Automatiken will ({B3}, {B4}, {B23}, {B31}, {B32}): den Haken „{L:TEXT.L_PRUEFEN}“ setzen. Speichern."
A_S2 = "Im Plugin Reiter „MQTT“: „{L:MQTT.L_EIN}“ (bei einer Neuinstallation ab Werk an) und für die beiden Befehle {B12}/{B32} „{L:BEFEHL.L_ANNEHMEN}“ anhaken, speichern. Gateway Fassung 2: auf der Abonnement-Seite des Gateways die Haken nach der Liste im Reiter MQTT setzen, bei status/ok und ziele „Noncached“."
A_S3 = "In Loxone Config erscheinen die Eingänge des Gateways unter Peripherie → Virtuelle Eingänge mit den Namen aus der Tabelle oben (Schritt 2). „Als Digitaleingang verwenden“ nicht anhaken; dem LoxBerry-Benutzer Rechte geben."
A_S4 = "Neue Seite „Beschattungswächter“ anlegen und die elf Eingänge darauf ziehen ({B1}–{B4}, {B13}–{B16}, {B18}–{B20})."
A_S5 = "Drei Virtuelle Eingänge anlegen (Peripherie → Virtuelle Eingänge → Virtueller Eingang, „In Visualisierung verwenden“ an): Tasten (Eingabeart Taster) „BW Befehl jetzt“ ({B11}) und „BW Automatiken jetzt zählen“ ({B31}); Schalter (Eingabeart Schalter, Startwert aus) „Beschattungsfreigabe (eigene Quelle)“ ({B27})."
A_S6 = "Am Ausgang „LoxBerry MQTT-Gateway“ (Peripherie → Virtuelle Ausgänge, Adresse /dev/udp/&lt;LoxBerry&gt;/11884) zwei Virtuelle Ausgang-Befehle anlegen: {B12} und {B32} mit dem Befehl bei EIN aus der Liste, nie „retain“. Zwei Benachrichtigungen anlegen: „BW Meldung“ ({B10}) und „BW ohne Ziel“ ({B26})."
A_S7 = "Die übrigen Bausteine über die Baustein-Suche (<b>F5</b>) setzen und die Parameter aus der Liste eintragen: Analogwertvalidierung, Konstante, Schwellwertschalter, Größer, Gleich, UND, 3 ODER, 3 Status, Formel, 2 Einschaltverzögerungen, Ausschaltverzögerung, Flankenerkennung. Status: Zeilen in der angegebenen Reihenfolge, die Zeile ohne Bedingung zuletzt; Eingänge ab V5 erscheinen erst nach Klick auf das „+“."
A_S8 = "Von oben nach unten verbinden. Ein ODER und ein UND haben genau zwei Eingänge. Wichtig: „BW Befehl jetzt senden“ ({B12}) bekommt seine Leitung vom ODER {B30}; {B5} hängt am Ausgang error."
A_S9 = "Eigene Quelle: Die Leitung, die bei Ihnen am Eingang „Sps“ (Sonnenstandsautomatik starten) der Automatikbeschattung liegt, zusätzlich an {B28} „BW Freigabe beruhigt“ legen und den Schalter {B27} löschen. Ohne eigene Freigabe bleibt {B27} als Handschalter stehen."
A_S10 = "Speichern und in den Miniserver übertragen; beim Systemstart „reconnect“ an das Gateway senden lassen (Seite „LoxBerry MQTT-Gateway“ im Musterprojekt)."
A_S11 = "Probe: in der App „BW Befehl jetzt“ drücken – die Rollläden in der Sonne fahren, „BW Letzter Befehl“ zeigt spätestens nach fünf Minuten „vor 0 min angenommen (HTTP 200)“. Mit Haken „{L:TEXT.L_PRUEFEN}“: „BW Automatiken jetzt zählen“ drücken – „BW Automatiken“ zeigt „… Automatiken scharf“."
H_START = "In den ersten Minuten nach dem Übertragen stehen die Virtuellen Eingänge auf 0, bis der erste Wert über das Gateway kommt (höchstens 5 Minuten; status_ok und ziele dank „Noncached“ sofort nach einem reconnect). „BW ohne Ziel“ meldet erst nach 15 min."
H_JETZT = "„BW Befehl jetzt“ und die Freigabe drücken das A sofort – ohne Rücksicht auf Zeitfenster, Abstand, Wetter und Sonnenstand des Plugins. Bei ausgeschaltetem Wächter lehnt das Plugin ab; ein zweiter Druck binnen einer Minute wird abgelehnt."
H_HAND = "Ein Rollladen, den jemand in der Sonne von Hand hochfährt, bleibt oben, bis der nächste Befehl kommt: im Takt frühestens nach dem Abstand (ab Werk 60 min), über die Freigabe erst, wenn sie länger als 1 h weg war ({B28})."
H_SPERRE = "Beschattung sperren (Fensterputzen, Fest, Wind) gehört an die Automatikbeschattung (Eingang DisSp bzw. Sperre), nicht ins Plugin."
H_ALLE = "„BW Automatiken“ zählt jeden Jalousiebaustein mit Automatik im Projekt (höchstens 40). Haben Sie Rollläden, die bewusst nie beschatten, steht dort dauerhaft „… von … scharf“, und „BW Meldung“ ({B10}) meldet über {B35} – dann {B35} von {B9} lösen oder den Haken „{L:TEXT.L_PRUEFEN}“ aus lassen."
BT_VIM = "Virtueller Eingang (Name wie das MQTT-Gateway ihn vergibt, Plugin Beschattungswächter)"
BT_GWA = "Virtueller Ausgang Befehl (Vorlage „LoxBerry MQTT-Gateway“, MQTT)"
B33_TYP = "Konstante"
B33_PARAM = "Wert 1"
B33_VERB = "—"
B34_TYP = "UND"
B34_PARAM = "— (nachts bleibt der letzte Zählstand stehen und meldet nicht)"
B34_VERB = "I1 = {B7}, I2 = {B15}"
B35_TYP = "Einschaltverzögerung"
B35_PARAM = "4800 s (Abstand im Plugin, ab Werk 60 Minuten, plus 20 Minuten: so lange holt der nächste Befehl eine Handbedienung zurück; wer den Abstand im Plugin ändert, stellt hier den neuen Abstand plus 20 Minuten ein)"
B35_VERB = "Eingang = {B34}"
H_DESIGNER = "Der Automatik-Designer der Loxone-App kann „auto“ an den Zentralbaustein zeitgesteuert schicken – ohne Zeitfenster, Abstand, Wetter, Sonne, Anwesenheit und Wirkungsmessung. Läuft beides, drückt das Haus das A doppelt (harmlos)."

