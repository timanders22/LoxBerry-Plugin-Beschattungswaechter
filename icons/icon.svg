<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Runde Scheibe, randfuellend, LoxBerry-Gruen. Kein Verlauf und
       kein Schatten: die Kachelansicht stellt die Symbole nebeneinander,
       und eine Mischung aus flach und plastisch sieht dort aus wie zwei
       Plugin-Sammlungen. -->
  <circle cx="256" cy="256" r="256" fill="#6dac20"/>
  <circle cx="256" cy="256" r="232" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6"/>

  <!-- Die Sonne steht HINTER dem Rollladen - darum zuerst -->
  <circle cx="330" cy="300" r="40" fill="#ffcd3c"/>
  <line x1="382" y1="300" x2="396" y2="300" stroke="#ffcd3c" stroke-width="9" stroke-linecap="round"/>
  <line x1="367" y1="337" x2="377" y2="347" stroke="#ffcd3c" stroke-width="9" stroke-linecap="round"/>
  <line x1="330" y1="352" x2="330" y2="366" stroke="#ffcd3c" stroke-width="9" stroke-linecap="round"/>
  <line x1="293" y1="337" x2="283" y2="347" stroke="#ffcd3c" stroke-width="9" stroke-linecap="round"/>
  <line x1="278" y1="300" x2="264" y2="300" stroke="#ffcd3c" stroke-width="9" stroke-linecap="round"/>
  <line x1="293" y1="263" x2="283" y2="253" stroke="#ffcd3c" stroke-width="9" stroke-linecap="round"/>
  <line x1="330" y1="248" x2="330" y2="234" stroke="#ffcd3c" stroke-width="9" stroke-linecap="round"/>
  <line x1="367" y1="263" x2="377" y2="253" stroke="#ffcd3c" stroke-width="9" stroke-linecap="round"/>

  <!-- Fensterrahmen -->
  <rect x="146" y="120" width="220" height="210" rx="10" fill="none" stroke="#ffffff" stroke-width="12"/>
  <!-- Rollladenkasten -->
  <rect x="134" y="94" width="244" height="22" rx="6" fill="#ffffff"/>
  <!-- Behang, halb heruntergelassen -->
  <rect x="152" y="126" width="208" height="120" fill="#ffffff"/>
  <line x1="162" y1="140" x2="350" y2="140" stroke="#6dac20" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="160" x2="350" y2="160" stroke="#6dac20" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="180" x2="350" y2="180" stroke="#6dac20" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="200" x2="350" y2="200" stroke="#6dac20" stroke-width="5" stroke-linecap="round"/>
  <line x1="162" y1="220" x2="350" y2="220" stroke="#6dac20" stroke-width="5" stroke-linecap="round"/>
  <!-- Schlussschiene -->
  <rect x="154" y="236" width="204" height="10" rx="3" fill="#6dac20"/>

  <!-- Der Knopf, um den es geht. Das A ist gezeichnet, nicht gesetzt:
       ein Schriftelement haengt von den Schriften des Rechners ab, der
       es darstellt. Der Name dieses Elements steht hier absichtlich
       nicht - eine Suche nach ihm soll in dieser Datei nichts finden. -->
  <circle cx="150" cy="350" r="46" fill="#ffffff"/>
  <line x1="150.0" y1="324.7" x2="131.1" y2="375.3" stroke="#6dac20" stroke-width="9" stroke-linecap="round"/>
  <line x1="150.0" y1="324.7" x2="168.9" y2="375.3" stroke="#6dac20" stroke-width="9" stroke-linecap="round"/>
  <line x1="138.3" y1="356.1" x2="161.7" y2="356.1" stroke="#6dac20" stroke-width="9" stroke-linecap="round"/>
</svg>
