[AUTHOR]
# Diese beiden Felder sind die KENNUNG des Plugins, kein Urhebervermerk.
# LoxBerry bildet daraus zusammen mit [PLUGIN] NAME die Kennzahl, unter der es
# Installation und Updates fuehrt. Sie duerfen spaeter NIE geaendert werden.
NAME=Beschattungswaechter Plugin Authors
EMAIL=beschattungswaechter@users.noreply.github.com

[PLUGIN]
VERSION=0.9.10
NAME=beschattungswaechter
FOLDER=beschattungswaechter
TITLE=Beschattungswaechter

[AUTOUPDATE]
# Seit 0.9.10 EIN. Bis dahin stand hier bewusst false, solange das
# Repository noch nicht stand: eine Adresse, die ins Leere zeigt, waere
# schlimmer als keine - LoxBerry fragt sie ab und meldet einen Fehler,
# ohne dass irgendetwas kaputt ist.
#
# Die Bedingung ist erfuellt: github.com/timanders22/LoxBerry-Plugin-Beschattungswaechter
# gibt es seit dem 25.08.2026, der Zweig master traegt release.cfg und
# prerelease.cfg, und beide Adressen dort zeigen auf einen Tag, den es
# gibt (erstes Release v0.9.4).
#
# Merke: diese Zeile steht IM Plugin. Ein Wechsel von false auf true
# erreicht nur Anlagen, die mindestens einmal von Hand aktualisieren -
# wer nie aktualisiert, bekommt auch die Einstellung nicht, die das
# Aktualisieren einschalten wuerde.
#
# Bei jedem Release: VERSION hier UND in release.cfg erhoehen, beide
# Adressen dort auf den neuen Tag setzen, das Release mit genau diesem
# Tag anlegen - und danach nachpruefen, dass der Tag wirklich existiert.
#
# Beide Adressen zeigen auf den Zweig master des EIGENEN Repositoriums -
# nie auf ein fremdes. LoxBerry vergleicht Fassungen als Zahl, und ein
# fremdes 2021.05.14 waere groesser als 0.9.10; daraus wuerde ein stilles
# Downgrade auf ein voellig anderes Plugin.
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Beschattungswaechter/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-Beschattungswaechter/master/prerelease.cfg
[SYSTEM]
INTERFACE=2.0
REBOOT=false
# Das Plugin liest config/system/general.json (Miniserver-Zugangsdaten).
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
ARCHITECTURE=false
